<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Suri</title>
    <style>
      :root {
        --bg: #0f1724;
        --panel: rgba(15, 23, 42, 0.6);
        --line: rgba(148, 163, 184, 0.2);
        --text: #e5edf8;
        --muted: #9db1c9;
        --accent: #6ea8fe;
        --accent-2: #8b5cf6;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        font-family: Inter, system-ui, Arial, sans-serif;
        background: var(--bg);
        color: var(--text);
        width: 320px;
        max-height: 560px;
        overflow-y: auto;
      }

      .wrap { padding: 14px; }

      .title-row {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 12px;
      }

      .logo {
        width: 22px;
        height: 22px;
        border-radius: 7px;
        display: grid;
        place-items: center;
        background: linear-gradient(135deg, var(--accent), var(--accent-2));
        color: white;
        font-weight: 800;
        font-size: 12px;
      }

      .title-row strong { font-size: 15px; }

      .section {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 12px;
        margin-bottom: 10px;
      }

      .section h2 {
        margin: 0 0 8px;
        font-size: 11px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--muted);
      }

      .theme-row {
        display: flex;
        gap: 6px;
      }

      .theme-option {
        flex: 1;
        border: 1px solid var(--line);
        background: transparent;
        color: var(--muted);
        padding: 8px 10px;
        border-radius: 8px;
        font-size: 13px;
        cursor: pointer;
      }

      .theme-option.active {
        background: linear-gradient(135deg, rgba(110, 168, 254, 0.22), rgba(139, 92, 246, 0.22));
        color: var(--text);
        border-color: rgba(110, 168, 254, 0.4);
      }

      .slider-row {
        margin-top: 10px;
      }

      .slider-row label {
        display: flex;
        justify-content: space-between;
        font-size: 12px;
        color: var(--muted);
        margin-bottom: 4px;
      }

      .slider-row input[type="range"] {
        width: 100%;
        accent-color: var(--accent);
      }

      .domain-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        padding: 6px 0;
      }

      .domain-row + .domain-row {
        border-top: 1px solid var(--line);
      }

      .domain-name { font-size: 13px; font-weight: 600; }
      .domain-hint { font-size: 11px; color: var(--muted); }

      .switch {
        position: relative;
        display: inline-block;
        width: 38px;
        height: 21px;
        flex: none;
      }

      .switch input { opacity: 0; width: 0; height: 0; }

      .switch-track {
        position: absolute;
        inset: 0;
        background: rgba(148, 163, 184, 0.3);
        border-radius: 999px;
        cursor: pointer;
        transition: background-color 160ms ease;
      }

      .switch-track::before {
        content: '';
        position: absolute;
        width: 15px;
        height: 15px;
        left: 3px;
        top: 3px;
        background: white;
        border-radius: 50%;
        transition: transform 160ms ease;
      }

      .switch input:checked + .switch-track {
        background: linear-gradient(135deg, var(--accent), var(--accent-2));
      }

      .switch input:checked + .switch-track::before {
        transform: translateX(17px);
      }

      .rule-row {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 60px 32px 22px;
        gap: 5px;
        align-items: center;
        padding: 6px 0;
      }

      .rule-row + .rule-row { border-top: 1px solid var(--line); }

      .rule-row input[type="number"], .rule-row select {
        width: 100%;
        min-width: 0;
        height: 30px;
        border-radius: 6px;
        border: 1px solid var(--line);
        background: rgba(15, 23, 42, 0.9);
        color: var(--text);
        padding: 4px 4px;
        font-size: 11px;
      }

      .rule-row input[type="color"] {
        width: 100%;
        height: 28px;
        padding: 2px;
        border-radius: 6px;
        border: 1px solid var(--line);
        background: rgba(15, 23, 42, 0.9);
      }

      .rule-remove {
        border: 0;
        background: transparent;
        color: #fca5a5;
        font-size: 16px;
        cursor: pointer;
        line-height: 1;
      }

      .rule-remove:disabled {
        color: var(--muted);
        cursor: not-allowed;
      }

      .rule-hint {
        font-size: 11px;
        color: var(--muted);
        margin: 0 0 8px;
      }

      .btn-row {
        display: flex;
        justify-content: space-between;
        gap: 8px;
        margin-top: 10px;
      }

      .btn {
        border: 1px solid var(--line);
        border-radius: 8px;
        background: rgba(15, 23, 42, 0.8);
        color: var(--text);
        padding: 7px 10px;
        font-size: 12px;
        font-weight: 600;
        cursor: pointer;
      }

      .btn.primary {
        background: linear-gradient(135deg, rgba(110, 168, 254, 0.28), rgba(139, 92, 246, 0.28));
        border-color: rgba(110, 168, 254, 0.4);
      }

      .status {
        min-height: 16px;
        font-size: 12px;
        color: var(--muted);
        margin-top: 4px;
      }

      .link {
        display: block;
        margin-top: 4px;
        color: var(--muted);
        text-decoration: none;
        font-size: 12px;
        text-align: center;
      }

      .theme-settings {
        display: none;
      }

      .theme-settings.active {
        display: block;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="title-row">
        <div class="logo">S</div>
        <strong>Suri</strong>
      </div>

      <div class="section">
        <h2>Temas</h2>
        <div class="theme-row">
          <button type="button" class="theme-option" data-theme="light">Claro</button>
          <button type="button" class="theme-option" data-theme="dark">Escuro</button>
        </div>
        <div class="theme-settings" data-theme-settings="light">
          <div class="slider-row">
            <label>Brilho <span id="lightBrightnessValue">100%</span></label>
            <input type="range" id="lightBrightness" min="50" max="150" step="5" value="100" />
          </div>
          <div class="slider-row">
            <label>Contraste <span id="lightContrastValue">100%</span></label>
            <input type="range" id="lightContrast" min="50" max="150" step="5" value="100" />
          </div>
        </div>
        <div class="theme-settings" data-theme-settings="dark">
          <div class="slider-row">
            <label>Brilho <span id="brightnessValue">100%</span></label>
            <input type="range" id="brightness" min="50" max="150" step="5" value="100" />
          </div>
          <div class="slider-row">
            <label>Contraste <span id="contrastValue">100%</span></label>
            <input type="range" id="contrast" min="50" max="150" step="5" value="100" />
          </div>
        </div>
      </div>

      <div class="section">
        <h2>Domínios ativos</h2>
        <div id="domains"></div>
      </div>

      <div class="section">
        <h2>Shop</h2>
        <div class="domain-row">
          <div class="domain-name">Mostrar SKU/ID</div>
          <label class="switch">
            <input type="checkbox" id="showShopInfo" />
            <span class="switch-track"></span>
          </label>
        </div>
      </div>

      <div class="section">
        <h2>Regras de tempo</h2>
        <p class="rule-hint">Cor do nome do cliente a partir de cada faixa de tempo em atendimento.</p>
        <div id="rules"></div>
        <div class="btn-row">
          <button id="addRule" class="btn" type="button">+ Regra</button>
          <button id="save" class="btn primary" type="button">Salvar regras</button>
        </div>
      </div>

      <div id="status" class="status" aria-live="polite"></div>
      <a id="openOptions" class="link" href="#">Abrir em uma aba maior</a>
    </div>

    <script src="storage.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
